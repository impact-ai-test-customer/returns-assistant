name: Azure Production
on:
  push:
    branches: [production]
    paths: [releases/production.json]
permissions:
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMPACT_KNOWLEDGE_RECEIPT: ${{ vars.IMPACT_KNOWLEDGE_RECEIPT }}
      IMPACT_REPLAY_CONTAINER_URL: ${{ vars.IMPACT_REPLAY_CONTAINER_URL }}
    steps:
      # The merged protected branch supplies code and the reviewed pin. Artifacts supply data only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      # The runtime that serves real calls gets these two values from this GitHub environment (Production); the release job
      # never sends a span and cannot read the key. Without both, production traffic is not seen and the release page says so.
      - name: Check the runtime observation setup
        env:
          IMPACT_OTLP_TRACES_ENDPOINT: ${{ vars.IMPACT_OTLP_TRACES_ENDPOINT }}
        run: |
          if [ -z "$IMPACT_OTLP_TRACES_ENDPOINT" ]; then
            echo "::warning::Set IMPACT_OTLP_TRACES_ENDPOINT (variable) and IMPACT_PRODUCT_KEY (secret, not readable here) in the Production environment so the runtime can report real calls."
          fi
      - name: Identify the preceding attempt
        id: attempt
        run: node scripts/phase.ts previous
      - name: Recover the preceding attempt phase
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: azure-production-attempt-${{ steps.attempt.outputs.previous }}
          path: previous-phase
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Preserve a conservative phase before any provider authority
        run: node scripts/phase.ts init
      - name: Verify the reviewed pin and its successful customer workflow
        id: pin
        run: node scripts/check-run.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.pin.outputs.action == 'deploy' && 'azure-development-bundle' || 'azure-production-bundle' }}
          path: bundle
          run-id: ${{ steps.pin.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify every receipt field against the reviewed pin
        id: receipt
        env:
          CHECK_RECEIPT: 'true'
        run: node scripts/check-run.ts
      - name: Inspect the immutable bundle
        env:
          RELEASE_ACTION: ${{ steps.pin.outputs.action }}
          BUNDLE_DIGEST: ${{ steps.pin.outputs.bundle_digest }}
        run: |
          if [ "$RELEASE_ACTION" = rollback ]; then
            node scripts/release.ts --environment production --bundle bundle --action inspect --expected-digest "$BUNDLE_DIGEST" --knowledge-receipt bundle/receipt.json
          else
            node scripts/release.ts --environment production --bundle bundle --action inspect --expected-digest "$BUNDLE_DIGEST"
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply only the reviewed Production release or rollback
        env:
          RELEASE_ACTION: ${{ steps.pin.outputs.action }}
          SOURCE_COMMIT: ${{ steps.receipt.outputs.source_commit }}
          BUNDLE_DIGEST: ${{ steps.pin.outputs.bundle_digest }}
          AGENT_VERSION: ${{ steps.pin.outputs.agent_version }}
        run: |
          mkdir -p out
          if [ "$RELEASE_ACTION" = rollback ]; then
            node scripts/release.ts --environment production --bundle bundle --source-commit "$SOURCE_COMMIT" --expected-digest "$BUNDLE_DIGEST" --action rollback --version "$AGENT_VERSION" --knowledge-receipt bundle/receipt.json --receipt out/receipt.json
          else
            node scripts/release.ts --environment production --bundle bundle --source-commit "$SOURCE_COMMIT" --expected-digest "$BUNDLE_DIGEST" --promotion-receipt bundle/receipt.json --receipt out/receipt.json
          fi
          cp -R bundle/agent out/agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-production-bundle
          path: out/
          retention-days: 90
          if-no-files-found: error
      - name: Publish the content-free exact release confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/confirm-release.ts
      - name: Retain content-free attempt phase and check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-production-attempt-${{ github.run_attempt }}
          path: |
            out/phase.json
            out/checks-evidence.json
          retention-days: 90
          if-no-files-found: warn
